services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: delo
      POSTGRES_USER: delo
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-delo-local-demo}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U delo -d delo"]
      interval: 3s
      timeout: 3s
      retries: 20
  api:
    build: ./backend
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql+psycopg://delo:${POSTGRES_PASSWORD:-delo-local-demo}@db:5432/delo
      SECRET_KEY: ${SECRET_KEY:-local-demo-change-before-publishing}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:5173,http://localhost}
      BUREAU_AVAILABLE: ${BUREAU_AVAILABLE:-true}
      DEMO_TOOLS_ENABLED: ${DEMO_TOOLS_ENABLED:-false}
      ASSISTANT_ENABLED: ${ASSISTANT_ENABLED:-false}
      ASSISTANT_MODEL: ${ASSISTANT_MODEL:-Qwen/Qwen3.8-27B}
      ASSISTANT_BASE_URL: ${ASSISTANT_BASE_URL:-http://host.docker.internal:8001/v1}
      ASSISTANT_API_KEY: ${ASSISTANT_API_KEY:-}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    expose:
      - "8000"
  frontend:
    build: ./frontend
    restart: unless-stopped
    depends_on:
      - api
    ports:
      - "${WEB_PORT:-80}:80"
volumes:
  pgdata:
